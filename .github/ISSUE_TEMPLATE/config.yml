# Force every issue through a template - blank issues almost never carry the
# version/stage/log information needed to diagnose an automation stall.
blank_issues_enabled: false

contact_links:
  - name: Early Alpha access request
    url: https://github.com/OmegaJackie/RelicAssist#early-alpha
    about: >-
      Relicable is invite-only during the early alpha and needs an access code to
      run. Access requests go through the developer directly - do NOT open a
      GitHub issue for one, they will be closed. See the README for how to ask.
      Never post an access code publicly, including in issues, comments or
      screenshots.

  - name: Setup and build help
    url: https://github.com/OmegaJackie/RelicAssist/blob/main/BUILDING.md
    about: >-
      Installing the companion plugins (vnavmesh, BossMod Reborn / Rotation
      Solver Reborn, Lifestream, TextAdvance, AutoDuty), building from source,
      and loading the dev plugin. Read this before filing a "it does not
      start / it does not build" issue.
