# Relicable - tagged release build
#
# Trigger: pushing a tag that starts with "v" (v1.4.174.0, v1.5.0.0-alpha, ...).
#
# What this has to work around, and why each step exists:
#
#   * net10.0-windows is a Windows-only target framework. Dalamud plugins cannot
#     be built on ubuntu-latest at all, so this job is pinned to windows-latest.
#   * ECommons is a hard ProjectReference (..\ECommons\ECommons\ECommons.csproj)
#     but it is NOT a submodule and is NOT committed - it is gitignored and
#     expected to be cloned next to the plugin project. actions/checkout will
#     therefore not bring it in; we clone it explicitly.
#   * The Dalamud reference assemblies (Dalamud.dll, ImGui.NET.dll, Lumina*.dll,
#     FFXIVClientStructs.dll) are NOT on a GitHub runner. Locally the SDK finds
#     them at %AppData%\XIVLauncher\addon\Hooks\dev. In CI we download the
#     Dalamud dev distribution and point DALAMUD_HOME at it.
#
# NOTE ON THE REPO LAYOUT ASSUMED HERE: the git repository root is the
# Relicable repository root, i.e. the checkout contains Relicable/, docs/, tools/,
# BUILDING.md, and this .github/ folder. ECommons is cloned to ./ECommons so
# that the ProjectReference ..\ECommons\ECommons\ECommons.csproj resolves.
# If you instead publish only the Relicable/ folder as the repository, every
# path below needs to drop the "Relicable/" prefix and ECommons must be cloned
# one level above the checkout.

name: Release

on:
  push:
    tags:
      - 'v*'

  # Lets you re-run the packaging by hand (produces artifacts, but no release,
  # because there is no tag to attach one to).
  workflow_dispatch:

permissions:
  # softprops/action-gh-release needs write access to create the release and
  # upload the asset.
  contents: write

jobs:
  build:
    runs-on: windows-latest   # REQUIRED: net10.0-windows cannot build on ubuntu

    steps:
      # ------------------------------------------------------------------
      # 1. The plugin source
      # ------------------------------------------------------------------
      - name: Check out Relicable
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. ECommons
      #
      # Relicable has a ProjectReference to ..\ECommons\ECommons\ECommons.csproj
      # (AddonMaster wrappers, chat helpers, etc). It is gitignored rather than
      # vendored or submoduled, so it must be cloned here or the build fails at
      # restore with "project file does not exist".
      #
      # PINNED TO A COMMIT SHA. This used to clone the default branch, which meant an
      # upstream commit could break a build of an ALREADY-TAGGED Relicable release --
      # and the failure surfaces as a wall of CS0246/CS1061 inside ECommons files, not
      # ours, so it reads like our bug. The window is widest right after a game patch,
      # when NightmareXIV is pushing AddonMaster fixes hourly.
      #
      # TO MOVE THE PIN: check the new SHA out locally, build, then edit the one line
      # below. Keep the date comment so how stale it is, is obvious.
      #
      # (`git clone --depth 1` cannot check out an arbitrary SHA, hence the
      # init + fetch --depth 1 <sha> shape; GitHub allows fetching a bare SHA.)
      # ------------------------------------------------------------------
      - name: Clone ECommons (gitignored dependency, not a submodule)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Exit codes are checked by hand below so the failure can be EXPLAINED. Without
          # this, PowerShell 7.3+ turns a nonzero native exit into a throw first and the
          # diagnostic never prints. (Harmless no-op on older PowerShell.)
          $PSNativeCommandUseErrorActionPreference = $false

          $sha = 'ea0ac0c63129e7bde3f40024088d6257602b23d8'   # 2026-06-29

          git init ECommons
          git -C ECommons remote add origin https://github.com/NightmareXIV/ECommons
          git -C ECommons fetch --depth 1 origin $sha
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Could not fetch ECommons $sha - has it been force-pushed away? Update the pin."
            exit 1
          }
          git -C ECommons checkout --detach FETCH_HEAD

          $head = git -C ECommons rev-parse HEAD
          if ($head -ne $sha) {
            Write-Error "ECommons is at $head, expected the pinned $sha."
            exit 1
          }
          Write-Host "ECommons pinned at: $head"

      # ------------------------------------------------------------------
      # 3. .NET 10 SDK
      #
      # Dalamud.NET.Sdk/15.0.0 targets net10.0-windows (API 14+ moved to .NET 10).
      # windows-latest may or may not already carry a .NET 10 SDK; install it
      # explicitly so the build does not depend on the runner image contents.
      # ------------------------------------------------------------------
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ------------------------------------------------------------------
      # 4. Dalamud reference assemblies
      #
      # Not present on the runner, and TWO projects need them, by two different
      # mechanisms - which is why this extracts to the default XIVLauncher path
      # rather than somewhere neutral:
      #
      #   * Relicable builds on Dalamud.NET.Sdk, which reads DALAMUD_HOME.
      #   * ECommons is a plain Microsoft.NET.Sdk project with hand-written
      #     <HintPath>$(DalamudLibPath)Dalamud.dll</HintPath> references, and on
      #     WINDOWS it hardcodes
      #         <DalamudLibPath>$(appdata)\xivlauncher\Addon\Hooks\dev\</DalamudLibPath>
      #     It only consults DALAMUD_HOME inside a Linux-conditioned PropertyGroup,
      #     so on a Windows runner it ignores it completely.
      #
      # Extracting only to RUNNER_TEMP therefore built nothing: ECommons resolved
      # every Dalamud/ImGui/Lumina/FFXIVClientStructs/Newtonsoft reference to a
      # path that does not exist on a runner, and the build died with ~1900
      # CS0246s inside ECommons (Window, WindowSystem, AtkUnitBase, ImGuiCol,
      # JsonProperty, IDalamudTextureWrap ...) before Relicable was even reached.
      # The errors name ECommons files, not ours - that is the tell.
      #
      # So: extract ONCE into %AppData%\XIVLauncher\addon\Hooks\dev - the path a
      # developer machine genuinely has, and the default both projects agree on -
      # and point DALAMUD_HOME at that same folder. One copy, both resolvers.
      #
      # WHICH TRACK: resolved at build time rather than hardcoded.
      #
      # This used to always take "latest.zip", the STABLE branch. For the hours-to-days
      # after a game patch, stable does not support the live client at all -- goatcorp
      # ships the working build on STAGING first -- so a release cut in that window
      # compiled against reference assemblies (chiefly FFXIVClientStructs) that no
      # player was running. It builds green and misbehaves at runtime, which is the
      # worst shape a patch-day bug can take. Hardcoding staging is wrong the other 50
      # weeks of the year, and "remember to flip it back" is not a mechanism.
      #
      # So ask goatcorp's own API which track supports the CURRENT live client, prefer
      # stable when both do, and download exactly the build it names. Falls back to the
      # old stable URL if the API cannot be reached, so an outage cannot block a release.
      #
      # The API level of whatever lands must match Dalamud.NET.Sdk's (currently 15);
      # a mismatch otherwise shows up as CS1061/CS0117 on single members rather than as
      # a clean error, so it is checked explicitly below.
      # ------------------------------------------------------------------
      - name: Download and extract Dalamud
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The path ECommons hardcodes on Windows, and Dalamud.NET.Sdk's own default.
          $dalamudDir = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null

          # Stable first: it is the right answer whenever it is a valid answer.
          $info = $null
          $chosen = $null
          foreach ($track in @('release', 'stg')) {
            try {
              $c = Invoke-RestMethod -Uri "https://kamori.goats.dev/Dalamud/Release/VersionInfo?track=$track" -TimeoutSec 30
            } catch {
              Write-Host "  ${track}: could not be queried ($($_.Exception.Message))"
              continue
            }
            Write-Host "  ${track}: $($c.assemblyVersion), supports game $($c.supportedGameVer), applicable=$($c.isApplicableForCurrentGameVer)"
            if ($c.isApplicableForCurrentGameVer -and $c.downloadUrl) {
              $info = $c
              $chosen = $track
              break
            }
          }

          $zip = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          if ($info) {
            Write-Host "Building against the '$chosen' track: Dalamud $($info.assemblyVersion)"

            # An API-level bump is a source change, not something to paper over: the SDK
            # version in Relicable.csproj and DalamudApiLevel in repo.json both have to move
            # with it. Fail here, where the reason is obvious.
            $major = ($info.assemblyVersion -split '[.\-]')[0]
            if ($major -ne '15') {
              Write-Error "Dalamud on '$chosen' is API $major but this repo targets API 15 (Dalamud.NET.Sdk/15.0.0). Bump the SDK version in Relicable/Relicable.csproj and DalamudApiLevel in repo.json."
              exit 1
            }

            Invoke-WebRequest -Uri $info.downloadUrl -OutFile $zip
          }
          else {
            Write-Host '::warning::No Dalamud track reported support for the live client; falling back to stable latest.zip. If a game patch just landed, WAIT rather than shipping this build.'
            Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $zip
          }
          Expand-Archive -Path $zip -DestinationPath $dalamudDir -Force

          # Sanity check: if Dalamud.dll is not here the build will fail later
          # with confusing "type or namespace not found" errors, so fail now.
          if (-not (Test-Path (Join-Path $dalamudDir 'Dalamud.dll'))) {
            Write-Error "Dalamud.dll not found in $dalamudDir - the distrib layout may have changed."
            exit 1
          }

          # ECommons references these by name; a distrib reshuffle that drops one would
          # otherwise resurface as a wall of CS0246 deep inside ECommons. Name the missing
          # file here instead.
          # (The full HintPath set from ECommons.csproj.)
          foreach ($required in @(
            'Dalamud.dll','Dalamud.Common.dll','Dalamud.Bindings.ImGui.dll',
            'Dalamud.Bindings.ImPlot.dll','Dalamud.Bindings.ImGuizmo.dll',
            'Lumina.dll','Lumina.Excel.dll','FFXIVClientStructs.dll',
            'InteropGenerator.Runtime.dll','Newtonsoft.Json.dll','Mono.Cecil.dll',
            'Reloaded.Hooks.Definitions.dll','Serilog.dll','TerraFX.Interop.Windows.dll')) {
            if (-not (Test-Path (Join-Path $dalamudDir $required))) {
              Write-Error "$required not found in $dalamudDir - ECommons references it by HintPath."
              exit 1
            }
          }

          # Export DALAMUD_HOME too, for Dalamud.NET.Sdk (Relicable's own project).
          "DALAMUD_HOME=$dalamudDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Dalamud reference assemblies at: $dalamudDir"

          # Record what this build actually compiled against. FFXIVClientStructs is the one
          # that moves every patch, and "which build was 1.5.x compiled against" is the first
          # question asked when a release misbehaves only after a patch.
          foreach ($n in @('Dalamud.dll','FFXIVClientStructs.dll','Lumina.dll','Lumina.Excel.dll')) {
            $f = Get-Item (Join-Path $dalamudDir $n)
            Write-Host ('  {0,-26} {1}' -f $f.Name, $f.VersionInfo.FileVersion)
          }

      # ------------------------------------------------------------------
      # 5. Build
      # ------------------------------------------------------------------
      - name: Restore
        run: dotnet restore Relicable/Relicable.csproj

      - name: Build (Release)
        run: dotnet build Relicable/Relicable.csproj -c Release --no-restore

      # ------------------------------------------------------------------
      # 6. Package
      #
      # Dalamud.NET.Sdk already produces a correctly-shaped plugin zip during a
      # Release build. On a local Release build of this project it landed at
      #   Relicable\bin\Release\Relicable\latest.zip
      # and contained: Relicable.dll, Relicable.json, Relicable.deps.json,
      # ECommons.dll/.pdb/.xml, Data\relics\*.json, Data\questpaths\*.json -
      # i.e. exactly the payload we want to ship. Preferring that zip avoids
      # re-deriving the layout by hand.
      #
      # PATHS ARE GLOBBED ON PURPOSE. The output directory is not verified for a
      # CI build (the SDK can emit bin\Release\, bin\x64\Release\, or a
      # TFM subfolder depending on version/config), so we search rather than
      # hardcode. EXPECT TO ADJUST THIS STEP AFTER THE FIRST RUN - check the
      # step log, which prints what it actually found.
      # ------------------------------------------------------------------
      - name: Package Relicable.zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $outZip = Join-Path $staging 'Relicable.zip'

          Write-Host '--- build output tree (for path verification) ---'
          Get-ChildItem -Path 'Relicable/bin' -Recurse -File |
            Select-Object -ExpandProperty FullName | Write-Host

          # Preferred: the zip the Dalamud SDK packed for us.
          $sdkZip = Get-ChildItem -Path 'Relicable/bin' -Recurse -Filter 'latest.zip' -File |
                    Sort-Object LastWriteTime -Descending |
                    Select-Object -First 1

          if ($sdkZip) {
            Write-Host "Using SDK-produced plugin zip: $($sdkZip.FullName)"
            Copy-Item -Path $sdkZip.FullName -Destination $outZip -Force
          }
          else {
            # Fallback: assemble the zip by hand from wherever Relicable.dll landed.
            Write-Host 'No SDK latest.zip found - packing manually.'

            $dll = Get-ChildItem -Path 'Relicable/bin' -Recurse -Filter 'Relicable.dll' -File |
                   Where-Object { $_.FullName -match '\\Release\\' } |
                   Sort-Object LastWriteTime -Descending |
                   Select-Object -First 1
            if (-not $dll) { throw 'Relicable.dll not found under Relicable/bin - adjust the glob in this step.' }

            $outDir = $dll.Directory.FullName
            Write-Host "Plugin output directory: $outDir"

            $pack = Join-Path $env:RUNNER_TEMP 'pack'
            Remove-Item -Recurse -Force $pack -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $pack | Out-Null

            # Relicable.dll + the manifest + ECommons.dll (a real runtime dependency).
            Copy-Item (Join-Path $outDir 'Relicable.dll')  $pack -Force
            Copy-Item (Join-Path $outDir 'Relicable.json') $pack -Force
            foreach ($optional in @('Relicable.deps.json','ECommons.dll')) {
              $p = Join-Path $outDir $optional
              if (Test-Path $p) { Copy-Item $p $pack -Force }
            }

            # Data/*.json - the objective + questpath tables, copied to output by
            # the csproj's None/CopyToOutputDirectory items. Preserve the tree.
            $dataSrc = Join-Path $outDir 'Data'
            if (Test-Path $dataSrc) {
              Copy-Item $dataSrc (Join-Path $pack 'Data') -Recurse -Force
            } else {
              throw "Data folder not found next to Relicable.dll ($dataSrc) - adjust this step."
            }

            Compress-Archive -Path (Join-Path $pack '*') -DestinationPath $outZip -Force
          }

          Write-Host '--- Relicable.zip contents ---'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead($outZip)
          $names = $z.Entries | ForEach-Object { $_.FullName }
          $names | Write-Host
          $z.Dispose()

          # Guards: a zip without the manifest is not installable by Dalamud,
          # and a zip without Data/ produces a plugin that loads but has no
          # objectives.
          if ($names -notcontains 'Relicable.json') { throw 'Relicable.json missing from the zip.' }
          if ($names -notcontains 'Relicable.dll')  { throw 'Relicable.dll missing from the zip.' }
          if (-not ($names | Where-Object { $_ -match '^Data[\\/]' })) { throw 'Data/*.json missing from the zip.' }

      # Always keep the zip as a build artifact, even for workflow_dispatch runs
      # where no release is created.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relicable
          path: artifacts/Relicable.zip
          if-no-files-found: error

      # ------------------------------------------------------------------
      # 7. Release
      #
      # Only for tag pushes. The asset name must stay "Relicable.zip" -
      # repo.json's download links point at /releases/latest/download/Relicable.zip.
      #
      # prerelease MUST BE FALSE: Dalamud's installer ignores prereleases.
      # GitHub's /releases/latest/ endpoint resolves to the latest FULL release and
      # deliberately skips drafts and prereleases. Marking the release as a prerelease
      # therefore leaves /releases/latest/download/Relicable.zip returning 404 - the
      # install fails for every tester with "Response status code does not indicate
      # success: 404 (Not Found)" out of Dalamud's PluginManager.DownloadPluginAsync,
      # which looks like a broken plugin but is really a URL with nothing behind it.
      # (make_latest cannot rescue this: GitHub will not treat a prerelease as latest.)
      #
      # Nothing is lost by dropping the flag. The alpha status is carried where it
      # actually matters: repo.json sets IsTestingExclusive, so Dalamud only offers the
      # plugin to users who have enabled testing builds, and the release notes below say
      # it outright. The alternative - keeping the badge and pointing repo.json at
      # /releases/download/<tag>/Relicable.zip - would mean editing repo.json on every
      # single release, which is a much easier thing to forget.
      # ------------------------------------------------------------------
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Relicable ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/Relicable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            **Relicable ${{ github.ref_name }}**

            Install via the third-party repository manifest:
            `https://raw.githubusercontent.com/OmegaJackie/Relicable/main/repo.json`
            (Dalamud: /xlsettings > Experimental > Custom Plugin Repositories).
            Testing builds must be enabled - this plugin is testing-exclusive.

            Requires the companion plugins listed in BUILDING.md
            (vnavmesh, BossMod Reborn or Rotation Solver Reborn, Lifestream,
            TextAdvance, AutoDuty).
